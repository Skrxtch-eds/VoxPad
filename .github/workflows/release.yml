name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile and test
        run: |
          python -m compileall -q outputs/source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download verified Parakeet model
        shell: python
        run: |
          import sys, threading
          from pathlib import Path
          sys.path.insert(0, str(Path('outputs/source').resolve()))
          from model_manager import download
          download(Path('outputs/Transcriber/models'), 'parakeet', threading.Event(), lambda *args: None)
      - name: Build portable archive
        run: python scripts/build_runtime_portable.py
      - name: Scan distribution with Microsoft Defender
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build_windows import version; print(version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $bundle = Join-Path $env:GITHUB_WORKSPACE "work/runtime-dist-$version/VoxPad"
          & $scanner -Scan -ScanType 3 -File $bundle -ReturnHR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable runtime and checksum
        shell: python
        run: |
          import hashlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          from runtime_portable_smoke import run
          archive = next(Path('outputs').glob('VoxPad-*-Windows-x64-runtime.zip'))
          expected = archive.with_suffix('.zip.sha256').read_text('ascii').split()[0]
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected
          audio = Path('outputs/Transcriber/models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/test_wavs/en.wav')
          report = run(archive.resolve(), audio.resolve(), session_check=False)
          assert report['ready'] and report['portable_runtime'], report
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build_windows import version; print(version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; keeping its assets."; exit 0 }
          @"
          VoxPad for Windows 10/11 x64.

          Extract the entire ZIP, then open VoxPad/VoxPad.cmd. Python, native libraries and the Parakeet model are included. Dictation runs locally on CPU without an internet connection. Whisper and GigaAM are optional downloads in Settings.

          Keep runtime, app, models and launch.py next to VoxPad.cmd. User settings and history are stored in data. Preserve data and additional models when updating. The app uses a private Python runtime and readable source modules.
          "@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag "outputs/VoxPad-$version-Windows-x64-runtime.zip" "outputs/VoxPad-$version-Windows-x64-runtime.zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VoxPad $version" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
