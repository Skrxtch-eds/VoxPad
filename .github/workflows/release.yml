name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Compile and test
        run: |
          python -m compileall -q outputs/source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download verified Parakeet model
        shell: python
        run: |
          import sys, threading
          from pathlib import Path
          sys.path.insert(0, str(Path('outputs/source').resolve()))
          from model_manager import download
          download(Path('outputs/Transcriber/models'), 'parakeet', threading.Event(), lambda *args: None)
      - name: Build portable archive
        run: python scripts/build_runtime_portable.py --launcher cmd
      - name: Check release secrets and dependency advisories
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          archive = next(Path('outputs').glob('VoxPad-*-Windows-x64-portable.zip'))
          subprocess.run([sys.executable, 'scripts/security_check.py', '--archive', str(archive), '--osv'], check=True)
      - name: Verify portable hashes and original Python signatures
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build_windows import version; print(version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows_signing.py --portable --archive "outputs/VoxPad-$version-Windows-x64-portable.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan distribution with Microsoft Defender
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build_windows import version; print(version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $bundle = Join-Path $env:GITHUB_WORKSPACE "work/runtime-cmd-dist-$version/VoxPad"
          & $scanner -Scan -ScanType 3 -File $bundle -ReturnHR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $scanner -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE\outputs\VoxPad-$version-Windows-x64-portable.zip" -ReturnHR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify portable runtime and checksum
        shell: python
        run: |
          import hashlib, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tests').resolve()))
          from runtime_portable_smoke import run
          archive = next(Path('outputs').glob('VoxPad-*-Windows-x64-portable.zip'))
          expected = archive.with_suffix('.zip.sha256').read_text('ascii').split()[0]
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected
          # Hosted runners have no interactive audio session; verify model startup there.
          report = run(archive.resolve(), None, session_check=False)
          assert report['ready'] and report['portable_runtime'], report
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'scripts'); from build_windows import version; print(version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release $tag already exists; keeping its assets."; exit 0 }
          gh release create $tag "outputs/VoxPad-$version-Windows-x64-portable.zip" "outputs/VoxPad-$version-Windows-x64-portable.zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VoxPad $version" --notes-file "docs/releases/$version.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
